# ==============================================================================
# Configuração de Proxy Reverso Nginx + CDN Edge Cache para Cabeça de Droid
# Compatível com Ubuntu Linux na VM Oracle (147.15.40.30) e Cloudflare / Edge CDNs
# ==============================================================================

# Definição do upstream para o servidor FastAPI/Uvicorn local
upstream cabeca_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name 147.15.40.30 localhost;

    # Otimização de I/O de disco para arquivos estáticos de alta performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compressão de borda Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Diretório raiz da aplicação
    root /home/ubuntu/Cabeca_de_Droid/static;
    index index.html;

    # 1. Assets estáticos pesados (Imagens, Shards, Logos, Sprites)
    # Servidos direto pelo Nginx sem tocar no processo Python
    location /assets/ {
        alias /home/ubuntu/Cabeca_de_Droid/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header CDN-Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 2. Arquivos CSS, JS e Fontes da pasta static
    location ~* \.(css|js|woff2?|ttf|eot|ico|svg)$ {
        root /home/ubuntu/Cabeca_de_Droid/static;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header CDN-Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 3. API REST, SSE e WebSockets delegados ao FastAPI
    location /api/ {
        proxy_pass http://cabeca_backend;
        proxy_http_version 1.1;

        # Headers para compatibilidade com WebSockets e SSE (Server-Sent Events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desativa buffering para suportar streaming em tempo real do progresso de sync
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 4. Raiz e SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
