[project]
name = "cabeca-de-droid"
version = "5.2.0"
description = "Suíte local inteligente com interface Web Glassmorphism, Clean Architecture FastAPI, RAG e gestão de contas HoYoverse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas (Lacas0010)" }]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "scratch",
    "user_data_google",
    "assets",
    "static_data",
]

[tool.ruff.lint]
select = [
    "E9",    # Syntax / runtime errors
    "F",     # Pyflakes (erros críticos de sintaxe e importação)
]
ignore = [
    "F401",  # Unused imports (em pacotes __init__.py ou retrocompatibilidade)
    "F841",  # Unused local variables
    "E402",  # Module level import not at top of file
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
disallow_untyped_defs = false
files = ["schemas", "services"]
