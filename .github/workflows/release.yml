name: Build and Release Windows Standalone

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag semântica para publicação manual (ex: v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp release version into version.py
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          @'
          import json, os, pathlib, re, subprocess
          tag = (os.environ.get("INPUT_TAG") or (os.environ.get("REF_NAME") if os.environ.get("REF_TYPE") == "tag" else "")).strip()
          if not tag:
              try:
                  tag = subprocess.check_output(["git", "describe", "--tags", "--abbrev=0"], text=True).strip()
              except Exception:
                  tag = ""
          clean = re.sub(r"^v", "", tag, flags=re.IGNORECASE).strip()
          if clean:
              pathlib.Path("version.py").write_text(f"__version__ = {json.dumps(clean)}\n", encoding="utf-8")
          print("Stamped version:", clean or "kept existing")
          '@ | python -

      - name: Run packaging and import sanity tests
        run: |
          python -c "import server, build; build.verify_sakuga_vendor_assets(); print('FastAPI app and Sakuga vendor assets verified')"
          python -m unittest tests.test_packaging_suite tests.test_updater_suite -v

      - name: Prefetch official element icons for offline packaging
        run: |
          python -c "from services.media_service import download_element_icons; download_element_icons()"

      - name: Build Windows standalone executable and ZIP
        run: |
          python build.py
          python -c "import zipfile; z = zipfile.ZipFile('dist/Cabeca_de_Droid-Windows-x64.zip'); print('ZIP assets:', z.namelist()); assert 'Cabeca_de_Droid.exe' in z.namelist()"

      - name: Upload ZIP workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cabeca_de_Droid-Windows-x64
          path: dist/Cabeca_de_Droid-Windows-x64.zip

      - name: Generate What's Changed release notes
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          @'
          import os, pathlib, subprocess
          cur_tag = (os.environ.get("INPUT_TAG") or os.environ.get("REF_NAME") or "HEAD").strip()
          prev_tag = ""
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", f"{cur_tag}^"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              ).strip()
          except Exception:
              try:
                  tags = subprocess.check_output(["git", "tag", "--sort=-creatordate"], text=True).splitlines()
                  tags = [t.strip() for t in tags if t.strip() and t.strip() != cur_tag]
                  prev_tag = tags[0] if tags else ""
              except Exception:
                  prev_tag = ""
          rev_range = f"{prev_tag}..{cur_tag}" if prev_tag else cur_tag
          commits_raw = subprocess.check_output(
              ["git", "log", "--no-merges", "--pretty=format:- %s (%h)", rev_range],
              text=True,
          ).strip()
          lines = ["## What's Changed", ""]
          lines.append(commits_raw if commits_raw else "- Release build and packaging updates.")
          pathlib.Path("release_notes.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(pathlib.Path("release_notes.md").read_text(encoding="utf-8"))
          '@ | python -

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          files: dist/Cabeca_de_Droid-Windows-x64.zip
